name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on: workflow_dispatch

jobs:
  deploy-to-github-pages:
    permissions:
      contents: write
    # use ubuntu-latest image to run steps on
    runs-on: ubuntu-latest
    steps:
    # uses GitHub's checkout action to checkout code form the master branch
    - uses: actions/checkout@v2

    # sets up .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v3.0.3
      with:
        dotnet-version: '10'

    # Pin the SDK to 10.0.x (what the demo is built and tested with). ubuntu-latest also ships a newer SDK (11.0.100 since
    # 2026-11), and without a global.json `dotnet` picks the newest: the workload step then installs the net11 wasm-tools
    # and publish fails with NETSDK1147 (wasm-tools-net10 missing). Written here, not committed, so local builds are unaffected.
    - name: Pin .NET SDK 10
      run: |
        echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > global.json
        dotnet --version

    # Install dotnet wasm buildtools workload
    - name: Install .NET WASM Build Tools
      run: dotnet workload install wasm-tools        

    # The AOT publish outgrows the runner's 16 GB at its peak (parallel clang -O2 on the big .bc files, ~8 min in). 2026-11-27: three of four
    # deploys died there with "MSB4166: Child node exited prematurely" (the kernel's OOM kill); the job then hung and GitHub kept no log.
    # Extra swap lets the peak through at full optimization; the sampler below prints memory every 30 s so the peak is on record.
    - name: Add swap for the AOT peak
      run: |
        free -m
        sudo fallocate -l 16G /mnt/aot.swap
        sudo chmod 600 /mnt/aot.swap
        sudo mkswap /mnt/aot.swap
        sudo swapon /mnt/aot.swap
        free -m
        df -h /mnt .

    # publishes Blazor project to the publish-folder
    - name: Publish .NET Core Project
      run: |
        ( while sleep 30; do echo "[mem] $(date +%T) $(free -m | awk '/Mem:/{printf "used %d/%d MB", $3, $2} /Swap:/{printf ", swap %d MB", $3}')  top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s %d MB; ", $2, $1/1024}')"; done ) &
        sampler=$!
        dotnet publish ./SpawnDev.ILGPU.ML.Demo/ --nologo -c:Release -p:DemoAot=true --output publish
        status=$?
        kill $sampler
        exit $status
      
    # The pushed branch refuses files over 100 MB: the AOT runtime (dotnet.native.wasm, ~130 MB) ships as its .gz copy only;
    # index.html's loadBootResource fetches the .gz copies off localhost
    - name: Drop raw files the gh-pages branch cannot hold
      run: find publish/wwwroot -type f -size +95M -print -delete

    # copy index.html to 404.html to serve the same file when a file is not found
    - name: copy index.html to 404.html
      run: cp publish/wwwroot/index.html publish/wwwroot/404.html

    # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
    - name: Add .nojekyll file
      run: touch publish/wwwroot/.nojekyll      
      
    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4.4.1
      with:
        branch: gh-pages
        folder: publish/wwwroot    
